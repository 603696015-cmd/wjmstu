function showSubMenu(obj,flag) {
	var toolbar = document.getElementById("toolbar");
	var toolbar_link = document.getElementById("toolbar_link");
	toolbar.style.display='';	
	toolbar.style.top="20px";
	toolbar_link.innerHTML="";
	toolbar.style.left=f_GetX(obj) + "px";

	var html="";
	switch(flag){
		case "address":
			html = '<a >联系人</a> <a>联系组</a> <a>搜索/打印</a>  <a >导入/导出</a>';
			break;
		case "options":
			html='<a >参数设置</a> <a  >修改资料</a> <a  >修改密码</a>  <a>更多选项</a>';
			break;
		case "POP":
			html='<a  >POP设置</a> <a >POP收信</a>';
			break;
		default:
			html='';
	}
	toolbar_link.innerHTML = html;
}
</SCRIPT>
