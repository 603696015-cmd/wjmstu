function outPopPanel() {
  var popItem = "<tr class='fdrrow_normal' style='font-size:12px'>"
              + "<td width='4'>&nbsp;</td><td>　<span>"
          + "SHORTNAME</span></td>"
            + "<td align='right'>"

            + "&gt;</span></td>  </tr>";
   var regPopName = /NAME/g;
   var regPopFid = /FID/g;
   var regPopShortName = /SHORTNAME/g;

   var popItemCnt = poplist.length;
   if (popItemCnt <= 0) {
      var FolderObj = document.getElementById("popPanelFolder");
      if (FolderObj) {
         FolderObj.style.display = "none";
      }
   }

   for ( var i = 0 ; i < popItemCnt; i ++ ) {
    if ( poplist[i].fid == 0 ) poplist[i].fid = 1 ; //如果没有指定文件夹，就指定默认文件夹为：收信箱,不指定也可以的。
    var item = popItem;
    var thename = poplist[i].name;
    var foldername = poplist[i].fdname;
    var shortname = foldername;
    if (shortname.length>10) {
        shortname = shortname.substr(0, 10) + "...";
    }
    item = item.replace(regPopShortName, shortname);
    item = item.replace(regPopName, thename);
    item = item.replace(regPopFid,poplist[i].fid);
    document.write(item);
   }
}
