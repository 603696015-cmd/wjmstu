<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link rel="stylesheet" type="text/css" href="../css/scorm1.2_index.css"/>
<title>SCORM 1.2.2 LMS</title>
<style type="text/css">


html,body {
	height: 100%;
	overflow: hidden;
}

/*reset panel posotion*/
.panel {
	position: absolute;
	top: 0px;
	right: 0px;
	bottom: 0px;
	left: 0px;
	z-index: 1;
}

.top {
	height: 100px;
	background-color: #ccc;
}

.left {
	top: 100px;
	bottom: 30px;
	width: 200px;
	background-color: #eee;
}

.main {
	top: 100px;
	background-color: #f5f5f5;
}


.panel iframe {
	width: 100%;
	height: 100%;
}

/* class for hide top*/
.hidetop .top {
	display: none;
}

.hidetop .left,.hidetop .main {
	top: 0px;
}

/* class for hide bottom*/
.hidebottom .bottom {
	display: none;
}

.hidebottom .left,.hidebottom .main {
	bottom: 0px;
}

/*class for hide left*/
.hideleft .left {
	display: none;
}

.hideleft .main {
	left: 0px;
}

/* HACK:*IE6/7 _IE6*/
html { *
	padding: 100px 0px 30px 0px;
}

.panel { *
	position: relative;
}

.top { *
	margin-top: -100px; *
	margin-bottom: 0px;
}

.left { *
	height: 100%; *
	float: left; *
	top: 0px;
}

.main { *
	height: 100%; *
	top: 0; *
	left: 0px;
	_left: -3px;
}  /*IE 6 float 3px bug*/
.hidetop { *
	padding-top: 0px;
}

.hidebottom { *
	padding-bottom: 0px;
}

.hideleft { *
	padding-left: 0px;
}

</style>
<script type="text/javascript">
		function toggleClass(dom,className){
		    var reg = new RegExp(className,"g"),
		        cn = dom.className,
		        newcn= cn.indexOf(className)==-1?(cn+" "+className):cn.replace(reg,"");
		    dom.className=newcn;
		}

    	var API = null;

    	/****************************************************************************
    	 ** 初始化Applet
    	 ***************************************************************************/
    	function initAPI(){
    		API = window.LMSFrame.document.APIAdapter;
    	}
</script>
</HEAD>
<body onload="initAPI();">
	<!-- 页面顶部布局 -->
	<div id="ptop" class="panel top">
		<iframe frameborder="0" scrolling="no" style="overflow: hidden;" id="LMSFrame" name="LMSFrame" src="LMSFrame.jsp"></iframe>
		
	</div>
	<!-- 页面左边布局 -->
	<div id="pside" class="panel left">
		<div class="leftMenuHeader">
	    	<div id="cTool" class="tool"> </div>
			<span class="headertext">SCORM菜单</span>
		</div>
		<div class="leftMenuBody">
		    <iframe frameborder="0" scrolling="no" style="height: 0px;" id="code" src="code.jsp" name="code"></iframe>
		    <iframe frameborder="0" scrolling="no" style="overflow: auto;" id="menu" src="menu_empty.htm" name="menu"></iframe>
	    </div>
	</div>
	<div id="midbar">
		<div id="sTool" class="tool"> </div>
	</div>
	<!-- 页面右边布局(显示体) -->
	<div id="pbody" class="panel main">
		<div id="curinfobar">
			<div>&nbsp;</div>
		</div>
		<div id="pcontent">
		<iframe frameborder="0"  style="overflow: auto;" id="Content" name="Content" src="LMSStart.htm"></iframe>
		</div>
    </div>
	<br class="clear"/>
	<script type="text/javascript" src="../js/jquery.js"></script>
	<script type="text/javascript" src="../js/scorm1.2_index.js"></script>
</body>
</html>
